<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Doctor · Fitness-for-duty check for astronauts</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0f1623; --panel:#16203c; --panel2:#1b2747; --line:#2c3b66; --text:#eef2ff; --muted:#8fa0c8;
  --accent:#818cf8; --amber:#fbbf24; --red:#f87171; --green:#4ade80;
  --mono:'Share Tech Mono',ui-monospace,monospace; --sans:Rajdhani,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 var(--sans)}
body{min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(circle at 20% -10%,#312e8155,transparent 50%),radial-gradient(circle at 110% 110%,#818cf812,transparent 40%)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px}
.logo{font:700 26px var(--sans);letter-spacing:4px}.logo b{color:var(--accent)}
.sub{color:var(--muted);font-family:var(--mono);font-size:13px}
.tools{display:flex;gap:8px}
.layout{flex:1;display:grid;grid-template-columns:250px 1fr 250px;gap:16px;padding:16px 20px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.left{display:flex;flex-direction:column;align-items:center}
#avatar{width:160px;height:160px}
.ora-svg{width:100%;height:100%}.ora-eyes{transform-origin:100px 81px;transition:transform .12s}
.ora-ring{animation:pulse 3s ease-in-out infinite;transform-origin:center}
@keyframes pulse{50%{stroke-opacity:.6}}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;min-height:80px;margin:10px 0;position:relative}
.bubble:before{content:'';position:absolute;top:-7px;left:50%;border:7px solid transparent;border-top:0;border-bottom-color:var(--line)}
.steps{list-style:none;padding:0;margin:6px 0 0;width:100%;font-family:var(--mono);font-size:13px;counter-reset:s}
.steps li{padding:5px 8px;border-left:2px solid var(--line);color:var(--muted);counter-increment:s}
.steps li:before{content:counter(s,decimal-leading-zero) ' '}
.steps li.cur{border-color:var(--accent);color:var(--text);background:#818cf810}
.steps li.done{color:#6b7aa3}
main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 24px;min-width:0}
h2{margin:0 0 6px;font-size:28px;letter-spacing:1px}
h3{margin:14px 0 6px;font-size:19px;color:var(--accent)}
h4{margin:0 0 10px;font-family:var(--mono);font-weight:400;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:2px}
.help{color:var(--muted);margin:0 0 14px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font:16px var(--sans)}
input[type=range]{padding:0;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.checks{display:flex;flex-direction:column;gap:6px;justify-content:center}
.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:8px 12px}
legend{color:var(--accent);font-weight:700;padding:0 6px}
.opt{flex-direction:row;align-items:center;gap:8px;font-weight:500;padding:3px 0;cursor:pointer}
.opt b{font-family:var(--mono);color:var(--amber);width:18px}
.slider{margin:10px 0}.slider output,label output{font-family:var(--mono);color:var(--amber)}
button{font:600 16px var(--sans);border-radius:6px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);color:var(--text);background:var(--panel2)}
button.primary{background:var(--accent);color:#0f1623;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.1)}
button.ghost:hover{border-color:var(--accent)}
button.small{padding:4px 10px;font-size:14px}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
#stage>button.ghost{margin-top:14px}
.sensors{font-size:15px;display:flex;flex-direction:column;gap:8px}
.sensors small{color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:4px}
.mini{display:flex;flex-direction:column;font-family:var(--mono);font-size:12px;color:var(--muted);padding-left:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:4px}.dot.ok{background:var(--green)}
.cam{margin-top:12px;position:relative}
.cam video{width:100%;border-radius:8px;transform:scaleX(-1);background:#000;aspect-ratio:4/3;object-fit:cover}
.cam button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.sim{margin-top:12px;font-size:14px}
/* PVT */
.pvt-box{height:300px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;cursor:pointer;user-select:none;background:#0c1322}
.pvt-box span{font:700 64px var(--mono);color:var(--muted)}
.pvt-box.on{border-color:var(--amber)}.pvt-box.on span{color:var(--amber)}
.progress{height:6px;background:var(--panel2);border-radius:3px;margin-top:10px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .1s}
/* camera / docking */
.cam-test{position:relative;max-width:720px}
.cam-test video,.cam-test canvas{width:100%;display:block;border-radius:10px}
.cam-test video{transform:scaleX(-1);opacity:.55}
.cam-test canvas{position:absolute;inset:0}
.hint{margin-top:8px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.hint.alert{color:var(--amber);font-size:18px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.dock canvas{width:100%;border-radius:10px;border:1px solid var(--line);cursor:crosshair;touch-action:none}
/* results */
.verdict{display:flex;align-items:baseline;gap:16px;padding:14px 20px;border-radius:10px;border:2px solid}
.verdict span{font:700 44px var(--sans);letter-spacing:4px}.verdict small{color:var(--muted);font-family:var(--mono)}
.verdict.go{border-color:var(--green);color:var(--green);background:#4ade8010}
.verdict.caution{border-color:var(--amber);color:var(--amber);background:#fbbf2410}
.verdict.nogo{border-color:var(--red);color:var(--red);background:#f8717112}
.verdict.baseline{border-color:var(--accent);color:var(--accent)}
.note{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:4px}
.chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:20px;border:1px solid;font-weight:600}
.chip.ok{color:var(--green)}.chip.warn{color:var(--amber)}.chip.bad{color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols ul,.cols ol{margin:0;padding-left:20px}
li.warn{color:var(--amber)}li.bad{color:var(--red)}li.ok{color:var(--green)}
.metrics{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
.metrics th,.metrics td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
.metrics th:first-child,.metrics td:first-child{text-align:left}
.metrics td{font-family:var(--mono);font-size:14px}.metrics td:first-child{font-family:var(--sans)}
.metrics tr.warn td{color:var(--amber)}
.rad .bar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:6px 0}
.rad .bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--amber),var(--red))}
.rad small{color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#histCv{width:100%;background:#0c1322;border:1px solid var(--line);border-radius:8px}
.warn{color:var(--amber)}
footer{padding:8px 20px;color:var(--muted);font:12px var(--mono);border-top:1px solid var(--line)}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .left{flex-direction:row;flex-wrap:wrap;gap:12px}#avatar{width:90px;height:90px}.bubble{flex:1;min-width:200px}.steps{display:none}
  .grid2,.cols{grid-template-columns:1fr}
}
/* v2 additions */
.langtog{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langtog button{border:0;border-radius:0;padding:4px 10px;font-size:14px;background:transparent;color:var(--muted)}
.langtog button.active{background:var(--accent);color:#0f1623}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:12px}
details.adv{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0 14px}
details summary{cursor:pointer;color:var(--accent);font-weight:700}
details[open] summary{margin-bottom:10px}
.symrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.segs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.seg{flex-direction:row;font-weight:500;cursor:pointer}
.seg input{display:none}
.seg span{padding:4px 10px;font-size:14px;color:var(--muted);border-left:1px solid var(--line)}
.seg:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent);color:#0f1623}
.split{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.badge{padding:5px 12px;border-radius:6px;border:1px solid var(--line);font-weight:600}
.badge small{color:var(--muted);font-weight:400;font-family:var(--mono);font-size:12px}
.badge.go{color:var(--green);border-color:var(--green)}.badge.caution{color:var(--amber);border-color:var(--amber)}
.badge.nogo{color:var(--red);border-color:var(--red)}.badge.baseline{color:var(--accent);border-color:var(--accent)}
.score{display:grid;grid-template-columns:160px 1fr 34px;align-items:center;gap:10px;margin:6px 0;font-size:15px}
.score b{font-family:var(--mono);text-align:right}
.sbar{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
.sbar div{height:100%}.sbar .ok{background:var(--green)}.sbar .warn{background:var(--amber)}.sbar .bad{background:var(--red)}
.findings{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.findings ul{margin:2px 0 8px;padding-left:20px}
b.ok{color:var(--green)}b.warn{color:var(--amber)}b.bad{color:var(--red)}p.ok{color:var(--green)}
.swbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.swbox h4 small{margin-left:6px;text-transform:none;letter-spacing:0}
.swgrid{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
.scale{font:700 18px var(--mono);padding:2px 7px;border-radius:5px;border:1px solid var(--green);color:var(--green)}
.scale.s1,.scale.g1,.scale.g2{border-color:var(--amber);color:var(--amber)}
.scale.s2,.scale.s3,.scale.s4,.scale.s5,.scale.g3,.scale.g4,.scale.g5{border-color:var(--red);color:var(--red)}
.swmsg{font-size:14px;margin:8px 0}.swmsg.ok{color:var(--green)}.swmsg.warn{color:var(--amber)}.swmsg.bad{color:var(--red)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.muted{color:var(--muted);font-size:11px;font-family:var(--mono)}
.mini{font-family:var(--mono);font-size:12px;color:var(--muted)}
#doseCv{width:100%;background:#0c1322;border:1px solid var(--line);border-radius:8px}
@media (max-width:1000px){.grid3,.findings{grid-template-columns:1fr}.symrow{flex-direction:column;align-items:flex-start}}
.swgrid .mini{grid-column:1/-1}
/* ORA v2 */
#avatar{width:190px;height:auto}
.ora{--ora:#818cf8;position:relative;text-align:center}
.ora.state-speaking{--ora:#818cf8}.ora.state-listening{--ora:#4ade80}.ora.state-analyzing{--ora:#fbbf24}.ora.state-alert{--ora:#f87171}
.ora .seg{fill:var(--ora);opacity:.22;transition:fill .4s}.ora .seg.major{opacity:.55}
.ora .ring{transform-origin:100px 100px;animation:oraSpin 24s linear infinite}
.ora.state-analyzing .ring{animation-duration:4s}.ora.state-alert .ring{animation:oraSpin 8s linear infinite,oraPulse .8s ease-in-out infinite}
.ora .frame{fill:none;stroke:var(--ora);stroke-width:1.5;opacity:.6}
.ora .lens{stroke:#1e2a52;stroke-width:3}
.ora .ticks line{stroke:var(--ora);stroke-width:1.2;opacity:.45}
.ora .iris{transition:transform .35s ease-out}
.ora .iris-ring{fill:none;stroke:var(--ora);stroke-width:2;opacity:.8;stroke-dasharray:4 3}
.ora .iris-ring2{fill:none;stroke:var(--ora);stroke-width:1;opacity:.5}
.ora .pupil{animation:oraGlow 2.4s ease-in-out infinite}
.ora .scan{transform-origin:100px 100px;opacity:0}
.ora.state-analyzing .scan{opacity:1;animation:oraSpin 1.6s linear infinite}
.ora .lid{fill:#0c1322;transition:all .12s}
.ora .ora-name{fill:var(--ora);font:600 9px var(--mono);letter-spacing:4px;text-anchor:middle;opacity:.8}
.ora .vbar{fill:var(--ora);transition:height .08s,y .08s}
.ora-state{font:11px var(--mono);letter-spacing:3px;color:var(--ora);margin-top:2px}
@keyframes oraSpin{to{transform:rotate(360deg)}}
@keyframes oraPulse{50%{opacity:.4}}
@keyframes oraGlow{50%{opacity:.65}}
@media (prefers-reduced-motion:reduce){.ora .ring,.ora .scan,.ora .pupil{animation:none}}
/* daily mode */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 16px}
.mode{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:var(--panel2);display:flex;flex-direction:column;gap:4px;font-weight:500}
.mode input{display:none}.mode b{font-size:20px}.mode small{color:var(--muted)}
.mode:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.breath{height:300px;display:grid;place-items:center;position:relative;background:#0c1322;border:1px solid var(--line);border-radius:12px}
.breath div{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#818cf855,#818cf811 60%,transparent 70%);border:2px solid var(--accent);transition:transform .1s linear}
.breath span{position:absolute;font:600 24px var(--sans);letter-spacing:2px}
.tap-box{height:260px;border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;background:#0c1322}
.tap-box span{font:700 72px var(--mono);color:var(--accent)}.tap-box small{color:var(--muted)}
.tap-box.hit{border-color:var(--amber)}
.grip{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:center}
.grip canvas{width:100%;border:1px solid var(--line);border-radius:10px}
.grip-msg{font-weight:600;font-size:18px;min-height:70px}.grip-val{font:700 40px var(--mono);color:var(--accent)}
.psyrow{display:grid;grid-template-columns:1fr 200px 30px;gap:10px;align-items:center;padding:4px 0}
.psyrow output{font-family:var(--mono);color:var(--amber)}
.calrow{display:flex;align-items:flex-end;gap:8px;grid-column:1/-1}.calrow label{flex:0 0 280px}
.dsprev{overflow-x:auto;max-height:220px;margin-bottom:10px}#dsCv{width:100%;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.score{grid-template-columns:200px 1fr 34px}
.imu{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:center}.imu canvas{width:100%;border:1px solid var(--line);border-radius:10px}
.breath.closed div{border-color:var(--amber);opacity:.5}
.bands{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bands div{display:flex;align-items:center;justify-content:center;min-width:2px;color:#0f1623;font:600 12px var(--mono);white-space:nowrap;overflow:hidden}
.ncards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.ncard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.ncard small{color:var(--muted);font-family:var(--mono);font-size:12px}.ncard b{font:700 28px var(--mono);color:var(--accent)}
.ncard span{color:var(--muted);font-size:13px}.ncard p{font-size:14px;margin:6px 0 0}
.ncard.warn b{color:var(--amber)}
#nCv{width:100%;border:1px solid var(--line);border-radius:8px}
@media (max-width:1000px){.ncards{grid-template-columns:1fr 1fr}}
.qrow{flex-direction:row;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cff-eye{width:220px;height:220px;margin:10px auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:radial-gradient(circle,#1b2747,#0c1322);font:700 40px var(--mono);color:var(--green)}
.cff{text-align:center}.cff .actions{justify-content:center}
.hab{display:flex;flex-direction:column;font:12px var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.hab b{font-family:var(--sans);color:var(--text);font-size:14px}.hab .warn{color:var(--amber)}
.dockwrap{position:relative}.dockwrap canvas{width:100%;display:block;border-radius:10px}.dockwrap #dkCv{position:absolute;inset:0;border:1px solid var(--line);cursor:crosshair;touch-action:none}
/* ===================== v3: mission bar, layered results, new tests ===================== */
:root{--panel3:#0a121c;--glow:0 0 0 1px #818cf833,0 8px 30px #0008}
header{background:linear-gradient(180deg,#0f1623,#0f1623)}
.tools{align-items:center}
.ico{width:18px;height:18px;vertical-align:-3px;flex-shrink:0}
.mbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel3)}
.mchip{display:flex;flex-direction:column;padding:3px 12px;border-left:2px solid var(--line);min-width:90px}
.mchip small{font:10px var(--mono);letter-spacing:2px;color:var(--muted)}
.mchip b{font:600 16px var(--sans);display:flex;gap:4px;align-items:center}
.mchip .scale{font-size:13px;padding:0 5px}
.mchip.right{margin-left:auto;border-left:0;border-right:2px solid var(--accent);text-align:right}
.mchip.right b{font-family:var(--mono);color:var(--accent);justify-content:flex-end}
.sdot{font:11px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid #f8717166;color:#fca5a5}
.sdot.ok{border-color:#4ade8088;color:var(--green)}
.sgroup{border-bottom:1px solid var(--line);padding-bottom:8px;display:flex;flex-direction:column;gap:7px}
.sgroup:last-child{border-bottom:0}
.sgroup h5{margin:4px 0 0;font:10px var(--mono);letter-spacing:2px;color:var(--accent);text-transform:uppercase}
main{box-shadow:var(--glow)}
/* setup */
button.big{font-size:20px;padding:12px 30px;letter-spacing:1px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:10px;background:var(--panel2)}
.tile .ico{width:26px;height:26px;color:var(--accent);margin-bottom:4px}
.tile b{font-size:17px}.tile small{color:var(--muted);font-weight:400;font-size:13px}
.tile:hover{border-color:var(--accent);background:#818cf80d}
/* results */
.hero{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px;background:linear-gradient(135deg,var(--panel2),var(--panel3))}
.hero.go{border-color:#4ade8055}.hero.caution{border-color:#fbbf2466}.hero.nogo{border-color:#f8717177}.hero.baseline{border-color:#818cf855}
.hleft{display:flex;flex-direction:column;gap:8px}
.hero .verdict{padding:10px 18px}
.overall{display:flex;align-items:baseline;gap:10px}.overall b{font:700 46px var(--mono)}.overall small{color:var(--muted)}
.overall b.ok{color:var(--green)}.overall b.warn{color:var(--amber)}.overall b.bad{color:var(--red)}
.radar{width:100%;max-width:290px;display:block;margin:auto}
.rring{fill:none;stroke:#2c3b66;stroke-width:1}.rring.lim{stroke:#fbbf2455;stroke-dasharray:3 3}
.raxis{stroke:#26345c}.rpoly{stroke-width:2}
.rlab{fill:var(--muted);font:11px var(--mono)}
.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:8px 14px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);background:#818cf80d}
.tab{display:none;padding-top:12px}.tab.on{display:block}
.ponly{display:none}
.score{grid-template-columns:20px 190px 1fr 34px}
.score .ico{color:var(--muted)}
.recs li,.top li,.fc li{margin:5px 0}
.top,.fc{list-style:none;padding-left:0!important}
.top li{display:flex;gap:6px}
.fc li{border-left:2px solid var(--amber);padding-left:8px}
.findings{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.fcard b{display:flex;gap:6px;align-items:center}
.metrics tr.grp td{color:var(--accent);font-family:var(--sans);font-weight:700;padding-top:12px;text-align:left}
/* downlink + control center */
.dl fieldset{display:flex;flex-direction:column;gap:6px}
.dl button .ico{width:16px;height:16px}
.cctools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cctools button.on{border-color:var(--accent);color:var(--accent)}
.transit{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--amber);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:15px}
.transit b{color:var(--amber)}.transit .ico{color:var(--amber)}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ccard{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.ccard.go{border-left-color:var(--green)}.ccard.caution{border-left-color:var(--amber)}.ccard.nogo{border-left-color:var(--red)}
.cchead{display:flex;justify-content:space-between;align-items:center}.cchead b{font-size:19px}
.ccbody{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}
.ccscore{font:700 42px var(--mono)}.ccscore.ok{color:var(--green)}.ccscore.warn{color:var(--amber)}.ccscore.bad{color:var(--red)}
.spark{width:100%;height:28px;margin-top:6px}.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.ccf{list-style:none;padding:0;margin:0;font-size:14px}.ccf li{display:flex;gap:6px;margin:3px 0}
h2 .ico{width:26px;height:26px;color:var(--accent)}
/* DSST */
.dsst{display:flex;flex-direction:column;gap:14px;align-items:center}
.dkey{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:100%;max-width:640px}
.dkey div{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:4px 0}
.dkey span{font:30px var(--mono);color:var(--text)}.dkey b{font:700 18px var(--mono);color:var(--amber);border-top:1px solid var(--line);width:100%;text-align:center}
.dmain{display:flex;gap:30px;align-items:center}
.dsym{width:160px;height:160px;display:grid;place-items:center;font:84px var(--mono);border:2px solid var(--accent);border-radius:14px;background:#0c1322}
.dpad{display:grid;grid-template-columns:repeat(3,60px);gap:6px}
.dpad button{height:56px;font:700 22px var(--mono);padding:0}
.dpad button.sel{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.dpad button.okf{background:#4ade8044}.dpad button.badf{background:#f8717155}
/* vision */
.vis{display:flex;flex-direction:column;align-items:center;gap:10px}
.vis canvas{width:min(440px,100%);border:1px solid var(--line);border-radius:6px;cursor:crosshair}
.vis .note{align-self:stretch}
.dirs{display:flex;gap:8px}.dirs button{font:700 24px var(--mono);width:60px}
.vis .progress{align-self:stretch}
/* presentation mode */
body.present{font-size:19px}
body.present .layout{grid-template-columns:230px 1fr 230px}
body.present footer{display:none}
body.present .bubble{font-size:17px}
/* print / PDF */
@media print{
  html,body{background:#fff!important;color:#000!important;font-size:12px}
  body{background-image:none}
  header{background:#fff!important;border:0}.logo{color:#000}
  header .tools,.mbar,aside,footer,.tabs,.noprint,#stage>button,.dl,.actions{display:none!important}
  .layout{display:block;padding:0}
  main{border:0;box-shadow:none;background:#fff;padding:0}
  .tab{display:block!important;break-inside:avoid}.ponly{display:block}
  .tab[data-p="dl"]{display:none!important}
  .hero,.fcard,.badge,.verdict{background:#fff!important;color:#000}
  h3{color:#035}.mini,small{color:#333}
  canvas{max-width:100%}
  .metrics td,.metrics th{border-color:#bbb}
}
@media (max-width:1000px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.dmain{flex-direction:column}.ccbody{grid-template-columns:1fr}}
.ccbody .rlab{font-size:10px}.ccbody{grid-template-columns:200px 1fr}
/* v4: coherence, planner */
.coh{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.coh.flag{border-color:var(--amber);box-shadow:0 0 0 1px #fbbf2444 inset}
.cohrow{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:15px}.cohrow b{font-family:var(--mono);text-align:right}
.maskb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--amber);border:1px dashed var(--amber);border-radius:6px;padding:3px 8px}
.tiles{grid-template-columns:repeat(5,1fr)}
.fcrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.fcrow>small{grid-column:1/-1}
.fcday{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.fcday span.ok{color:var(--green)}.fcday span.warn{color:var(--amber)}
.kpbars{display:flex;align-items:flex-end;gap:3px;height:56px}
.kpbars i{flex:1;border-radius:2px 2px 0 0}.kpbars i.ok{background:#4ade8088}.kpbars i.warn{background:var(--amber)}.kpbars i.bad{background:var(--red)}
.roster{display:flex;gap:8px;flex-wrap:wrap}
.plan td{text-align:left!important;vertical-align:middle}.plan select,.plan input{padding:4px 6px;font-size:14px}.plan input{width:54px}
.plan td.go b{color:var(--green)}.plan td.caution b{color:var(--amber)}.plan td.nogo b{color:var(--red)}
.plan tr.wrow td{border-bottom:1px solid var(--line);font-family:var(--sans);font-size:14px;padding-top:0}
@media (max-width:1000px){.tiles{grid-template-columns:1fr 1fr}.fcrow{grid-template-columns:1fr}}
.plan td{font-family:var(--sans)!important;font-size:15px}.plan td:nth-child(3){white-space:nowrap}

.bodywrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.bodymap{width:100%;max-width:640px;display:block;margin:auto}
.blegend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
.blegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.ridge{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.rcell{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;background:var(--panel2)}
.rcell b{font:700 26px var(--mono)}.rcell span{font-weight:700}.rcell small{color:var(--muted);font-size:12px;line-height:1.2}
.rcell.ok b{color:var(--green)}.rcell.warn b{color:var(--amber)}.rcell.bad b{color:var(--red)}.rcell.na b{color:var(--muted)}
.hrp{list-style:none;padding:0;margin:0;columns:2;column-gap:18px;font-size:15px}
.hrp li{break-inside:avoid;padding:3px 0;display:grid;grid-template-columns:12px 1fr;gap:6px;align-items:start}.hrp li i{margin-top:6px}
.hrp li i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.hrp li.ok i{background:var(--green)}.hrp li.warn i{background:var(--amber)}.hrp li.bad i{background:var(--red)}
.hrp li.na i{background:#45557f}.hrp li.next i{background:none;border:1px dashed var(--muted)}
.hrp li small{display:block;color:var(--muted);font-size:12px}
.mapgrid{display:grid;grid-template-columns:1fr;gap:16px}.mapgrid>*{min-width:0}
@media (max-width:1200px){.mapgrid{grid-template-columns:1fr}}
.gami{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.gtop{display:flex;justify-content:space-around;text-align:center}.gtop b{display:block;font:700 28px var(--mono);color:var(--accent)}.gtop small{color:var(--muted)}
.gami h4{margin:8px 0 4px}
.mission{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badges span{opacity:.3;filter:grayscale(1);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:18px;display:flex;align-items:center;gap:4px}
.badges span small{font-size:11px}.badges span.on{opacity:1;filter:none;border-color:var(--accent)}
.why{margin-top:6px;font-size:14px;color:var(--muted)}.why summary{cursor:pointer;color:var(--accent)}
@media (max-width:900px){.ridge{grid-template-columns:repeat(3,1fr)}.hrp{columns:1}}
/* --- simple / expert mode --- */
body.simple .adv-only{display:none!important}
body:not(.simple) .simple-only{display:none!important}
body.simple #steps,body.simple #swBox,body.simple #simBox{display:none}
body.simple .layout{grid-template-columns:220px 1fr 220px}
body.simple .simple-only .bodywrap{margin-bottom:6px}

.today{border:1px solid var(--accent);border-radius:16px;padding:12px 14px;margin:10px 0;background:linear-gradient(135deg,#818cf814,#0000)}
.today b{display:block;margin-bottom:6px}.today small{color:var(--muted)}
.chip{display:inline-block;padding:3px 10px;margin:0 6px 6px 0;border-radius:999px;background:#818cf822;color:var(--accent);font-size:14px}
.quick .qrow2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.swatches{display:flex;gap:6px}.swatches input{display:none}
.swatches i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid #0000;cursor:pointer}
.swatches input:checked+i{border-color:var(--accent);box-shadow:0 0 0 3px #818cf855}
.fu{border-color:var(--amber)!important;background:#fbbf2410}.fu legend{color:var(--amber)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flow>div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px}
.flow b{display:block}.flow small{color:var(--muted);font-size:12px}.flow ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.prof{color:var(--amber);margin-top:4px}
table.sm td,table.sm th{font-size:14px;padding:4px 6px}
@media (max-width:900px){.flow{grid-template-columns:1fr}}
/* softer, rounder look in Simple mode */
body.simple fieldset,body.simple .fcard,body.simple .hero,body.simple .gami,body.simple .bodywrap,body.simple main#stage{border-radius:18px}
body.simple .hero{background:linear-gradient(160deg,#1e2a52,#16203c)}

body.simple .verdict{border-radius:16px}
body.simple .tabs button{border-radius:999px}
.fuq[hidden],#fuBox[hidden]{display:none!important}
